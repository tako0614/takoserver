<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Takoserver Console</title>
    <meta
      name="description"
      content="Takoserverのリソース、利用量、請求、APIキーを管理します。"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="same-origin" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/app.css" />
    <style>
      html {
        background: #ffffff;
        color: #0e0e10;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) {
          background: #0b0b0c;
          color: #f2f2f3;
        }
      }
      html[data-theme="dark"] {
        background: #0b0b0c;
        color: #f2f2f3;
      }
      html[data-theme="light"] {
        background: #ffffff;
        color: #0e0e10;
      }
    </style>
    <script>
      (() => {
        const theme = localStorage.getItem("takoserver.theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
        const saved = localStorage.getItem("takoserver.console.locale");
        const languages =
          navigator.languages ?? (navigator.language ? [navigator.language] : []);
        document.documentElement.lang =
          saved === "ja" || saved === "en"
            ? saved
            : languages.some((language) => language.toLowerCase().startsWith("ja"))
              ? "ja"
              : "en";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Takoserver Consoleの利用にはJavaScriptが必要です。同じ操作はAPIとCLIからも利用できます。
    </noscript>
    <script type="module" src="/console.js"></script>
  </body>
</html>
