name: Takoserver dependency audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: takoserver-dependency-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  dependency-audit:
    name: audit locked dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pinned: v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine dependency audit scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          required=true
          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "push" ]]; then
            required=false
            diff_file="$RUNNER_TEMP/takoserver-dependency-audit-paths"
            range=""

            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              range="$BASE_SHA...$HEAD_SHA"
            elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
              required=true
            else
              range="$BEFORE_SHA..$HEAD_SHA"
            fi

            if [[ "$required" == "false" ]]; then
              if ! git diff --name-only -z --no-renames "$range" > "$diff_file"; then
                required=true
              else
                while IFS= read -r -d '' path; do
                  case "$path" in
                    .bun-version|package.json|bun.lock|package-lock.json|npm-shrinkwrap.json|bunfig.toml|.npmrc|*/package.json|*/bun.lock|*/package-lock.json|*/npm-shrinkwrap.json|*/bunfig.toml|*/.npmrc|scripts/run-bun-audit.ts|.github/workflows/dependency-audit.yml)
                      required=true
                      break
                      ;;
                  esac
                done < "$diff_file"
              fi
            fi
          fi

          printf 'required=%s\n' "$required" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        if: steps.scope.outputs.required == 'true'
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # pinned: v2.0.2
        with:
          bun-version-file: .bun-version

      - name: Audit dependencies
        if: steps.scope.outputs.required == 'true'
        run: bun scripts/run-bun-audit.ts

  go-vulnerability-audit:
    name: audit Go modules with govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Standard-library findings describe the toolchain that runs the scan, so
      # the scan uses the one toolchain every Go module declares in its
      # `toolchain` directive and the Core verifier image builds with. The
      # portable gate (tests/go-vulnerability-audit.test.ts) keeps the three in
      # agreement; change them together.
      GO_TOOLCHAIN_VERSION: "1.26.9"
      GOVULNCHECK_VERSION: v1.8.0
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pinned: v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine Go audit scope
        id: go_scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          # Reachability depends on the calling code as well as the module
          # graph, so any Go source change is in scope. Schedule and manual
          # runs always scan, which picks up newly published advisories.
          required=true
          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "push" ]]; then
            required=false
            diff_file="$RUNNER_TEMP/takoserver-go-audit-paths"
            range=""

            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              range="$BASE_SHA...$HEAD_SHA"
            elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
              required=true
            else
              range="$BEFORE_SHA..$HEAD_SHA"
            fi

            if [[ "$required" == "false" ]]; then
              if ! git diff --name-only -z --no-renames "$range" > "$diff_file"; then
                required=true
              else
                while IFS= read -r -d '' path; do
                  case "$path" in
                    *.go|go.mod|go.sum|go.work|go.work.sum|*/go.mod|*/go.sum|*/go.work|*/go.work.sum|Dockerfile|*/Dockerfile|.github/workflows/dependency-audit.yml)
                      required=true
                      break
                      ;;
                  esac
                done < "$diff_file"
              fi
            fi
          fi

          printf 'required=%s\n' "$required" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        if: steps.go_scope.outputs.required == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # pinned: v6.5.0
        with:
          go-version: ${{ env.GO_TOOLCHAIN_VERSION }}
          cache: false

      - name: Install govulncheck
        if: steps.go_scope.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail

          actual="$(go env GOVERSION)"
          if [[ "$actual" != "go${GO_TOOLCHAIN_VERSION}" ]]; then
            echo "::error::audit toolchain is ${actual}, expected go${GO_TOOLCHAIN_VERSION}"
            exit 1
          fi

          bin="$RUNNER_TEMP/govulncheck-bin"
          GOBIN="$bin" go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          printf '%s\n' "$bin" >> "$GITHUB_PATH"

      - name: Scan Go modules
        if: steps.go_scope.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' -t modules < <(git ls-files -z -- go.mod '*/go.mod')
          if (( ${#modules[@]} == 0 )); then
            echo "::error::no tracked go.mod found; refusing to report an empty Go audit as success"
            exit 1
          fi

          # govulncheck exits 3 when the code reaches a known vulnerability and
          # with another non-zero status when the scan itself fails. Both fail
          # the job; every module is scanned before the job reports.
          status=0
          for module in "${modules[@]}"; do
            directory="$(dirname "$module")"
            echo "::group::govulncheck ${directory}"
            if (cd "$directory" && govulncheck ./...); then
              echo "::endgroup::"
            else
              code=$?
              echo "::endgroup::"
              if (( code == 3 )); then
                echo "::error file=${module}::reachable vulnerabilities in ${directory}"
              else
                echo "::error file=${module}::govulncheck failed in ${directory} (exit ${code})"
              fi
              status=1
            fi
          done
          exit "$status"
