name: Takoserver quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: takoserver-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  selfhost-docker:
    name: Docker self-host smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pinned: v6.0.2
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # pinned: v2.0.2
        with:
          bun-version-file: .bun-version
      - name: Build and exercise Docker run and Compose
        run: bun run test:selfhost-docker

  quality:
    name: check and test
    runs-on: ubuntu-24.04
    # The complete suite exceeded 45 minutes on a shared runner, and later grew
    # past 75 (local pinned run 64.5 min; runner cancelled at 75). Reserve time
    # for every test plus the D1 migration and build phases; do not skip them.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pinned: v6.0.2
        with:
          persist-credentials: false

      # The current-publisher catalog tests read the public takoform-forms
      # corpus from a checkout beside this repository. Runners have no sibling
      # workspace, so the checkout goes to the runner temporary directory and
      # the tests are pointed at it through TAKOFORM_FORMS_ROOT. The pinned
      # commit comes from the catalog source itself, so the two cannot drift.
      - name: Check out the canonical takoform-forms corpus
        run: |
          set -euo pipefail
          commit="$(sed -n 's/^export const CURRENT_PUBLISHER_COMMIT = "\([0-9a-f]\{40\}\)".*$/\1/p' \
            src/takoform/current-publisher-catalog.ts)"
          if [ -z "${commit}" ]; then
            echo "CURRENT_PUBLISHER_COMMIT is not declared in the catalog source" >&2
            exit 1
          fi
          git clone --quiet https://github.com/tako0614/takoform-forms.git \
            "${RUNNER_TEMP}/takoform-forms"
          git -C "${RUNNER_TEMP}/takoform-forms" fetch --quiet origin "${commit}" || true
          git -C "${RUNNER_TEMP}/takoform-forms" cat-file -e "${commit}^{commit}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # pinned: v2.0.2
        with:
          bun-version-file: .bun-version

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run canonical Takoserver checks
        env:
          TAKOFORM_FORMS_ROOT: ${{ runner.temp }}/takoform-forms
        run: |
          # The native executable fixture verifies every ancestor including /.
          # Match the owning Linux gate's UID and keep its scratch private.
          test_tmp="$(sudo mktemp -d /tks.XXXXXX)"
          sudo mkdir -m 700 "$test_tmp/home"
          trap 'sudo rmdir -- "$test_tmp/home" "$test_tmp" 2>/dev/null || true' EXIT
          sudo -E env "HOME=$test_tmp/home" "PATH=$PATH" "TMPDIR=$test_tmp" \
            GIT_CONFIG_COUNT=2 \
            GIT_CONFIG_KEY_0=safe.directory "GIT_CONFIG_VALUE_0=$GITHUB_WORKSPACE" \
            GIT_CONFIG_KEY_1=safe.directory "GIT_CONFIG_VALUE_1=$TAKOFORM_FORMS_ROOT" \
            bun run check
